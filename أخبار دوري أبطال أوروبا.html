<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أخبار دوري أبطال أوروبا</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#0f1b3d;--muted:#5d6785;--line:#e2e6f0;--accent:#1d4ed8;--accent2:#0ea5e9;--ok:#16a34a;--warn:#d97706;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1126;--card:#131c3a;--text:#eaf0ff;--muted:#9aa6c8;--line:#24305a;--accent:#60a5fa;--accent2:#38bdf8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1126;--card:#131c3a;--text:#eaf0ff;--muted:#9aa6c8;--line:#24305a;--accent:#60a5fa;--accent2:#38bdf8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#0b1f6b,#1d4ed8 60%,#0ea5e9);color:#fff;padding:22px 16px 18px}
.wrap{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.85;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.theme{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:1.1rem;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:14px 12px 40px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:12px}
.day{margin:16px 4px 8px;color:var(--muted);font-weight:700;font-size:.85rem}
.match{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.team{font-weight:700;font-size:.98rem}
.team small{display:block;color:var(--muted);font-weight:400;font-size:.72rem}
.score{font-size:1.5rem;font-weight:800;background:var(--bg);border-radius:10px;padding:2px 14px;min-width:84px;direction:ltr}
.vs{font-size:.9rem;color:var(--muted);font-weight:700;min-width:84px}
.win{font-weight:800;color:var(--ok)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:8px}
.bar{display:flex;height:7px;border-radius:99px;overflow:hidden;margin-top:9px;direction:ltr;background:var(--line)}
.bar i{display:block}
.legend{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:3px;direction:ltr}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 7px;font-size:.72rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat span{font-size:.75rem;color:var(--muted)}
.news{background:var(--card);border-inline-start:4px solid var(--accent2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.news h3{margin:0 0 4px;font-size:1rem}
.news p{margin:0;color:var(--muted);font-size:.88rem}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:420px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:.75rem;position:sticky;top:0;background:var(--card)}
td.n{text-align:start;font-weight:600}
tr.q td:first-child{box-shadow:inset -4px 0 var(--ok)}
tr.p td:first-child{box-shadow:inset -4px 0 var(--warn)}
tr.o td:first-child{box-shadow:inset -4px 0 #dc2626}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin:10px 4px}
.key span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;background:var(--c)}
.empty{text-align:center;color:var(--muted);padding:30px}
footer{text-align:center;color:var(--muted);font-size:.75rem;padding:0 12px 24px}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><div><h1>🏆 أخبار دوري أبطال أوروبا</h1><p>موسم 2026/27 · مرحلة الدوري (36 فريقًا)</p></div>
 <button class="theme" id="theme" aria-label="تغيير المظهر">🌓</button></div>
</div></header>
<nav><div class="wrap" id="tabs">
 <button data-t="news" class="on">الأخبار</button>
 <button data-t="results">النتائج</button>
 <button data-t="fixtures">المباريات القادمة</button>
 <button data-t="table">الترتيب</button>
</div></nav>
<main><div class="wrap">
 <input class="search" id="q" type="search" placeholder="ابحث عن فريق…">
 <div id="view"></div>
</div></main>
<footer>البيانات لقطة حتى 17 أكتوبر 2026 · الأوقات بتوقيت جهازك</footer>

<script>
const AR={VIL:"فياريال",NAP:"نابولي",FEY:"فينورد",COM:"كومو",ASK:"لاسك لينز",LFC:"ليفربول",ROM:"روما",RMA:"ريال مدريد",AVL:"أستون فيلا",FEN:"فنربخشة",SHA:"شاختار دونيتسك",AEK:"أيك أثينا",BOG:"بودو غليمت",BVB:"بوروسيا دورتموند",MCI:"مانشستر سيتي",PSG:"باريس سان جيرمان",RBB:"ريال بيتيس",FCP:"بورتو",SLO:"سلوفان براتيسلافا",VFB:"شتوتغارت",SLA:"سلافيا براغ",SBH:"صباح",PSV:"آيندهوفن",BAR:"برشلونة",ATM:"أتلتيكو مدريد",MUN:"مانشستر يونايتد",SPO:"سبورتينغ لشبونة",ARS:"آرسنال",BMU:"بايرن ميونخ",BRU:"كلوب بروج",RCL:"لانس",RBL:"لايبزيغ",VIK:"فايكنغ",INT:"إنتر ميلان",LIL:"ليل",GAL:"غلطة سراي"};
const EN={VIL:"Villarreal",NAP:"Napoli",FEY:"Feyenoord",COM:"Como",ASK:"LASK",LFC:"Liverpool",ROM:"Roma",RMA:"Real Madrid",AVL:"Aston Villa",FEN:"Fenerbahce",SHA:"Shakhtar",AEK:"AEK",BOG:"Bodo/Glimt",BVB:"Dortmund",MCI:"Man City",PSG:"PSG",RBB:"Betis",FCP:"Porto",SLO:"Slovan",VFB:"Stuttgart",SLA:"Slavia",SBH:"Sabah",PSV:"PSV",BAR:"Barcelona",ATM:"Atletico",MUN:"Man United",SPO:"Sporting",ARS:"Arsenal",BMU:"Bayern",BRU:"Brugge",RCL:"Lens",RBL:"Leipzig",VIK:"Viking",INT:"Inter",LIL:"Lille",GAL:"Galatasaray"};
const R=[["VIL","NAP",3,1,"2026-10-13T19:00Z"],["FEY","COM",3,2,"2026-10-14T16:45Z"],["ASK","LFC",3,6,"2026-10-14T16:45Z"],["ROM","RMA",3,4,"2026-10-14T19:00Z"],["AVL","FEN",6,0,"2026-10-14T19:00Z"],["SHA","AEK",3,1,"2026-10-14T19:00Z"],["BOG","BVB",1,0,"2026-10-14T19:00Z"],["MCI","PSG",2,4,"2026-10-14T19:00Z"],["RBB","FCP",3,2,"2026-10-14T19:00Z"],["SLO","VFB",0,3,"2026-10-14T19:00Z"]].map(a=>({h:a[0],a:a[1],hs:a[2],as:a[3],t:a[4]}));
const F=[["FEN","SLA",57.7,22.6,19.7,"2026-10-20T16:45Z"],["SBH","BVB",10.3,14.9,74.8,"2026-10-20T16:45Z"],["ROM","SLO",83.2,10.7,6.1,"2026-10-20T19:00Z"],["FCP","PSV",53.9,23,23.1,"2026-10-20T19:00Z"],["LFC","VIL",64.2,19.9,15.9,"2026-10-20T19:00Z"],["MCI","AEK",91.6,6,2.4,"2026-10-20T19:00Z"],["PSG","BAR",39.3,21.7,39,"2026-10-20T19:00Z"],["NAP","BOG",60.7,20.8,18.5,"2026-10-20T19:00Z"],["VFB","ATM",33.1,25.3,41.6,"2026-10-20T19:00Z"],["COM","MUN",42.1,25.4,32.5,"2026-10-21T16:45Z"]].map(a=>({h:a[0],a:a[1],ph:a[2],pd:a[3],pa:a[4],t:a[5]}));
const T=[["PSG",2,0,0,6],["BAR",2,0,0,6],["AVL",2,0,0,6],["VFB",2,0,0,6],["LFC",2,0,0,6],["SPO",2,0,0,6],["ARS",2,0,0,6],["RMA",2,0,0,6],["RBB",2,0,0,6],["BMU",1,1,0,4],["SHA",1,1,0,4],["COM",1,0,1,3],["MUN",1,0,1,3],["VIL",1,0,1,3],["ATM",1,0,1,3],["BRU",1,0,1,3],["MCI",1,0,1,3],["BVB",1,0,1,3],["RCL",1,0,1,3],["AEK",1,0,1,3],["RBL",1,0,1,3],["SBH",1,0,1,3],["FEY",1,0,1,3],["BOG",1,0,1,3],["ROM",0,1,1,1],["PSV",0,1,1,1],["VIK",0,1,1,1],["FEN",0,1,1,1],["INT",0,0,2,0],["FCP",0,0,2,0],["SLA",0,0,2,0],["NAP",0,0,2,0],["ASK",0,0,2,0],["LIL",0,0,2,0],["GAL",0,0,2,0],["SLO",0,0,2,0]].map((a,i)=>({r:i+1,k:a[0],w:a[1],d:a[2],l:a[3],p:a[4]}));

const N=[
 {t:"ليفربول يكتسح لاسك لينز 6-3",p:"فوز كبير خارج الأرض يضع الريدز بين المتصدرين برصيد 6 نقاط."},
 {t:"أستون فيلا يسحق فنربخشة 6-0",p:"أكبر فوز في الجولة الثانية، والفريق الإنجليزي ضمن أصحاب العلامة الكاملة."},
 {t:"باريس سان جيرمان يهزم مانشستر سيتي 4-2 في الاتحاد",p:"انتصار ثمين يقود الفريق الفرنسي إلى صدارة الترتيب."},
 {t:"ريال مدريد يفوز في روما 4-3",p:"مباراة مفتوحة انتهت بفوز الملكي ليحافظ على العلامة الكاملة."},
 {t:"قمة نارية الثلاثاء: باريس سان جيرمان ضد برشلونة",p:"التوقعات متقاربة جدًا: 39.3% لباريس و39% لبرشلونة."},
 {t:"نابولي في ورطة: خسارتان وصفر نقاط",p:"سقط أمام فياريال 1-3 ويستقبل بودو غليمت في الجولة المقبلة."}
];

const $=s=>document.querySelector(s),view=$("#view");
let tab="news",term="";
const nm=k=>AR[k]||k;
const fmt=t=>new Intl.DateTimeFormat("ar-EG",{weekday:"long",day:"numeric",month:"long"}).format(new Date(t));
const hm=t=>new Intl.DateTimeFormat("ar-EG",{hour:"2-digit",minute:"2-digit"}).format(new Date(t));
const flt=a=>!term||[nm(a.h),nm(a.a),EN[a.h],EN[a.a]].some(x=>x.toLowerCase().includes(term));
const group=(arr,render)=>{
 if(!arr.length)return '<div class="empty">لا توجد نتائج مطابقة.</div>';
 let last="",out="";
 arr.forEach(m=>{const d=fmt(m.t);if(d!==last){out+=`<div class="day">${d}</div>`;last=d}out+=render(m)});
 return out;
};
const team=k=>`<div class="team">${nm(k)}<small>${EN[k]}</small></div>`;
const goals=R.reduce((s,m)=>s+m.hs+m.as,0);

function renderNews(){
 const best=[...R].sort((a,b)=>b.hs+b.as-a.hs-a.as)[0];
 let h=`<div class="stats"><div class="stat"><b>${R.length}</b><span>مباراة أخيرة</span></div><div class="stat"><b>${goals}</b><span>هدفًا</span></div><div class="stat"><b>${(goals/R.length).toFixed(1)}</b><span>معدل الأهداف</span></div></div>`;
 h+=`<div class="news"><h3>⚽ أكثر المباريات أهدافًا</h3><p>${nm(best.h)} ${best.hs} - ${best.as} ${nm(best.a)}</p></div>`;
 const q=N.filter(n=>!term||(n.t+n.p).includes(term));
 h+=q.map(n=>`<div class="news"><h3>${n.t}</h3><p>${n.p}</p></div>`).join("")||'<div class="empty">لا توجد أخبار مطابقة.</div>';
 return h;
}
function renderResults(){
 return group(R.filter(flt),m=>`<div class="match"><div class="row">${team(m.h)}<div class="score"><span class="${m.hs>m.as?"win":""}">${m.hs}</span> - <span class="${m.as>m.hs?"win":""}">${m.as}</span></div>${team(m.a)}</div><div class="meta"><span>انتهت</span><span>${hm(m.t)}</span></div></div>`);
}
function renderFixtures(){
 return group(F.filter(flt),m=>`<div class="match"><div class="row">${team(m.h)}<div class="vs">${hm(m.t)}</div>${team(m.a)}</div>
 <div class="bar"><i style="width:${m.ph}%;background:var(--accent)"></i><i style="width:${m.pd}%;background:var(--muted)"></i><i style="width:${m.pa}%;background:var(--accent2)"></i></div>
 <div class="legend"><span>${m.ph}%</span><span>تعادل ${m.pd}%</span><span>${m.pa}%</span></div>
 <div class="meta"><span class="badge">احتمالات الفوز</span></div></div>`);
}
function renderTable(){
 const rows=T.filter(r=>!term||nm(r.k).includes(term)||EN[r.k].toLowerCase().includes(term));
 const cls=r=>r<=8?"q":r<=24?"p":"o";
 return `<div class="tbl"><table><thead><tr><th>#</th><th style="text-align:start">الفريق</th><th>لعب</th><th>ف</th><th>ت</th><th>خ</th><th>نقاط</th></tr></thead><tbody>${rows.map(r=>`<tr class="${cls(r.r)}"><td>${r.r}</td><td class="n">${nm(r.k)}</td><td>${r.w+r.d+r.l}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td><b>${r.p}</b></td></tr>`).join("")}</tbody></table></div>
 <div class="key"><span style="--c:var(--ok)">1-8 دور الـ16 مباشرة</span><span style="--c:var(--warn)">9-24 الملحق</span><span style="--c:#dc2626">25-36 خروج</span></div>`;
}
const V={news:renderNews,results:renderResults,fixtures:renderFixtures,table:renderTable};
const draw=()=>{view.innerHTML=V[tab]()};
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));draw()});
$("#q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();draw()});
$("#theme").addEventListener("click",()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(r.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"});
draw();
</script>
</body>
</html>
